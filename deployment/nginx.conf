# Include only inside the existing HTTPS server block.
# Download tokens and node credentials must never enter web access/error logs.
location ~ "^/profiles/(?<dmit_token>[a-f0-9]{48})/(?<dmit_profile>surge\.conf|mihomo\.yaml|shadowrocket\.txt|shadowrocket\.conf)$" {
    alias /var/www/proxy-distribution/profiles/current/$dmit_token/$dmit_profile;
    default_type text/plain;
    add_header Cache-Control "private, no-store" always;
    add_header Profile-Update-Interval "12" always;
    access_log off;
    error_log /dev/null crit;
    limit_except GET { deny all; }
}
location /profiles/ { return 404; }

location ~ "^/proxy-rules/(?<dmit_rule_version>[a-f0-9]{64})/(?<dmit_client>surge|mihomo|shadowrocket)/(?<dmit_rule_file>[a-z0-9-]+\.(list|domainset|yaml))$" {
    alias /var/www/proxy-distribution/rules/releases/$dmit_rule_version/$dmit_client/$dmit_rule_file;
    default_type text/plain;
    add_header Cache-Control "public, max-age=86400, immutable";
    access_log off;
    limit_except GET { deny all; }
}
location /proxy-rules/ { return 404; }

location = /proxy-config/shadowrocket.conf {
    alias /var/www/proxy-distribution/profiles/current/shared/shadowrocket.conf;
    default_type text/plain;
    add_header Cache-Control "no-cache";
    access_log off;
    limit_except GET { deny all; }
}
