# Full profiles are private files retrieved over SSH only.
# Retain the separate Native WebSocket route in the site configuration.
location /profiles/ { access_log off; error_log /dev/null crit; return 404; }
location /proxy-config/ { access_log off; error_log /dev/null crit; return 404; }
location /proxy-rules/ { access_log off; error_log /dev/null crit; return 404; }
