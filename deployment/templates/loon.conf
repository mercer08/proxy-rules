# Import this complete Loon configuration.
[General]
ip-mode = ipv4-only
dns-server = system
skip-proxy = 127.0.0.1,localhost,*.local
bypass-tun = 127.0.0.0/8,169.254.0.0/16,224.0.0.0/4,255.255.255.255/32
udp-fallback-mode = REJECT
# Drop existing connections when a policy changes, e.g. HOME switching between home Wi-Fi and cellular.
disconnect-on-policy-change = true
proxy-test-url = http://cp.cloudflare.com/generate_204
internet-test-url = http://wifi.vivo.com.cn/generate_204
test-timeout = 5

[Proxy]
${PROXIES}

[Proxy Group]
PROXY = select,${PROXY_NAMES}
