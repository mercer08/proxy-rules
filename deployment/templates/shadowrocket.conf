# Import your personal node subscription, then activate this configuration.
[General]
update-url = ${MANAGED_URL}
dns-server = system
dns-direct-system = true
dns-direct-fallback-proxy = false
ipv6 = false
block-quic = all-proxy
udp-policy-not-supported-behaviour = REJECT

[Proxy Group]
PROXY = select, policy-regex-filter=^DMIT-(Native|WARP)$$, policy-select-name=DMIT-Native
