<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171c26'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'%3E%3Ccircle cx='8' cy='16' r='2.2'/%3E%3Ccircle cx='24' cy='9.5' r='2.2'/%3E%3Ccircle cx='24' cy='22.5' r='2.2'/%3E%3Cpath d='M10.2 16h1.6c4 0 4.5-6.5 9.9-6.5M11.8 16c4 0 4.5 6.5 9.9 6.5'/%3E%3C/g%3E%3C/svg%3E" />
  <title>DMIT · 私有配置台</title>
  <style>[hidden] { display: none !important; }</style>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand-row">
        <a class="brand" href="/" aria-label="私有配置台首页"><span class="brand-mark" data-icon="logo"></span><span class="brand-text"><strong>DMIT</strong><span>私有配置台</span></span></a>
        <button id="theme" class="icon-btn" aria-label="切换深色主题" title="切换深色主题"><span data-icon="moon"></span></button>
      </div>
      <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="查找账号" aria-label="查找账号" autocomplete="off" /><kbd>⌘K</kbd></label>
      <nav id="accounts" aria-label="账号列表"><div class="placeholder">正在连接私有配置…</div></nav>
      <div class="side-bottom" data-tip="完整配置只经本机 SSH 隧道读取，文件包只分享给对应账号本人">
        <span class="status-lock" data-icon="lock"></span>
        <div>SSH 私有通道<span>仅本机访问 · <span id="account-count">—</span> 个账号</span></div>
      </div>
    </aside>
    <main>
      <header class="account-header">
        <span id="account-avatar" class="account-avatar" aria-hidden="true"><span data-icon="logo"></span></span>
        <div class="account-heading">
          <h1><span id="account-title">私有配置台</span><span id="device-chip" class="device-chip" hidden></span></h1>
          <div class="account-meta">
            <span class="meta-item" title="此账号的节点"><span data-icon="server"></span><span id="node-names">等待加载</span></span>
            <span id="rules-scope" class="meta-item"><span data-icon="route"></span><span>公共分流规则</span></span>
            <span id="account-subtitle" class="policy-list" aria-label="策略组默认值">选择账号，查看、编辑并下载完整配置。</span>
          </div>
        </div>
        <div class="header-actions">
          <div id="version-bar" class="popover-wrap" hidden>
            <button id="version-toggle" class="ghost-btn" aria-expanded="false" aria-controls="version-panel" title="个人策略的历史版本：备份、下载或回滚"><span data-icon="history"></span><span>版本备份</span><span class="caret" data-icon="chevron"></span></button>
            <div id="version-panel" class="popover" role="dialog" aria-label="版本备份" hidden>
              <p class="popover-title">版本备份</p>
              <p class="popover-text">保存个人策略和回滚前都会自动备份，回滚恢复所选版本里各 App 的输出。</p>
              <select id="version-select" aria-label="配置历史版本"></select>
              <div class="popover-actions"><button id="backup-version" class="text-btn"><span data-icon="plus"></span><span>备份当前</span></button><button id="download-version" class="text-btn"><span data-icon="download"></span><span>下载旧版本</span></button><button id="rollback-version" class="text-btn danger"><span data-icon="undo"></span><span>回滚所选</span></button></div>
            </div>
          </div>
          <button id="refresh" class="icon-btn" title="刷新服务器配置" aria-label="刷新服务器配置"><span data-icon="refresh"></span></button>
          <button id="download-account" class="button primary" disabled title="下载此账号全部 App 配置，只分享给本人"><span data-icon="package"></span><span id="download-account-label">下载文件包</span></button>
        </div>
      </header>
      <section class="editor-card">
        <div class="client-bar">
          <div class="client-tabs" role="tablist" aria-label="客户端"><button class="client-tab active" data-client="surge" role="tab" aria-selected="true"><span class="app-mark" data-app="surge">Su</span>Surge</button><button class="client-tab" data-client="mihomo" role="tab" aria-selected="false"><span class="app-mark" data-app="mihomo">Mi</span>Clash / Mihomo</button><button class="client-tab" data-client="stash" role="tab" aria-selected="false"><span class="app-mark" data-app="stash">St</span>Stash</button><button class="client-tab" data-client="shadowrocket" role="tab" aria-selected="false"><span class="app-mark" data-app="shadowrocket">Sr</span>Shadowrocket</button><button class="client-tab" data-client="loon" role="tab" aria-selected="false"><span class="app-mark" data-app="loon">Lo</span>Loon</button><span id="tab-divider" class="tab-divider" hidden></span><button id="personal-tab" class="client-tab" data-client="personal" role="tab" aria-selected="false" hidden><span class="app-mark" data-app="personal" data-icon="sliders"></span>个人策略</button><button id="lan-tab" class="client-tab" data-client="lan" role="tab" aria-selected="false" hidden><span class="app-mark" data-app="lan" data-icon="lan"></span>内网规则</button></div>
          <div class="popover-wrap">
            <button id="help-toggle" class="ghost-btn quiet" aria-expanded="false" aria-controls="help-panel"><span data-icon="info"></span><span class="label">导入说明</span></button>
            <div id="help-panel" class="popover" role="dialog" aria-labelledby="import-title" hidden><p id="import-title" class="popover-title">导入 Surge</p><p id="import-help" class="popover-text">下载 surge.conf，在 Surge 中导入本地配置。公共规则仍由 jsDelivr 提供。</p><p class="popover-foot"><kbd>⌘S</kbd> 保存 · 文件包只分享给对应账号本人</p></div>
          </div>
        </div>
        <div class="editor-tools" role="toolbar" aria-label="编辑工具">
          <div class="file-info">
            <label class="file-picker" title="选择配置文件"><span data-icon="file"></span><select id="file-select" aria-label="配置文件"><option>surge.conf</option></select><span class="caret" data-icon="chevron"></span></label>
            <span id="file-origin" class="source-badge">自动生成</span>
          </div>
          <div class="tool-scroll">
            <div class="tool-group"><button class="tool-btn" data-action="undo" title="撤销 (⌘/Ctrl+Z)" aria-label="撤销"><span data-icon="undo"></span></button><button class="tool-btn" data-action="redo" title="重做 (⌘/Ctrl+Shift+Z)" aria-label="重做"><span data-icon="redo"></span></button></div>
            <div class="tool-group"><button class="tool-btn" data-action="find" title="查找 (⌘/Ctrl+F)" aria-label="查找"><span data-icon="search"></span></button><button class="tool-btn" data-action="replace" title="查找替换 (⌘/Ctrl+H)" aria-label="查找替换"><span data-icon="replace"></span></button><button class="tool-btn" data-action="goto" title="跳转到行 (Ctrl+G)" aria-label="跳转到行"><span data-icon="hash"></span></button><button class="tool-btn" data-action="palette" title="全部命令面板 (F1)" aria-label="全部命令"><span data-icon="command"></span></button></div>
            <div class="tool-group"><button class="tool-btn" data-action="fold" title="折叠全部" aria-label="折叠全部"><span data-icon="fold"></span></button><button class="tool-btn" data-action="unfold" title="展开全部" aria-label="展开全部"><span data-icon="unfold"></span></button><button class="tool-btn" data-action="comment" title="注释 / 取消注释 (⌘/Ctrl+/)" aria-label="注释或取消注释"><span data-icon="comment"></span></button><button class="tool-btn" data-action="sort" title="选中行排序（未选中时整篇）" aria-label="排序行"><span data-icon="sort"></span></button><button class="tool-btn" data-action="format" title="格式化 JSON (Shift+Alt+F)" aria-label="格式化"><span data-icon="braces"></span></button></div>
            <div class="tool-group"><button id="outline-toggle" class="tool-btn" data-action="outline" aria-pressed="true" title="显示 / 隐藏配置大纲" aria-label="配置大纲"><span data-icon="outline"></span></button><button id="wrap-toggle" class="tool-btn" data-action="wrap" aria-pressed="true" title="自动换行 (Alt+Z)" aria-label="自动换行"><span data-icon="wrap"></span></button><button id="minimap-toggle" class="tool-btn" data-action="minimap" aria-pressed="false" title="显示 / 隐藏代码缩略图" aria-label="代码缩略图"><span data-icon="minimap"></span></button><button id="whitespace-toggle" class="tool-btn" data-action="whitespace" aria-pressed="false" title="显示 / 隐藏空白字符" aria-label="显示空白字符"><span data-icon="pilcrow"></span></button></div>
            <div class="tool-group font-size"><button class="tool-btn" data-action="font-down" title="缩小字号" aria-label="缩小字号"><span data-icon="minus"></span></button><span id="font-size" title="编辑器字号">13</span><button class="tool-btn" data-action="font-up" title="放大字号" aria-label="放大字号"><span data-icon="plus"></span></button></div>
          </div>
          <div class="tool-end">
            <button id="diff-toggle" class="tool-btn labeled" data-action="diff" aria-pressed="false" title="与服务器已保存版本左右对比（有未保存的编辑时可用）" disabled><span data-icon="diff"></span><span>对比</span></button>
            <button id="fullscreen" class="tool-btn" data-action="fullscreen" aria-pressed="false" aria-label="全屏" title="全屏编辑 (⌘/Ctrl+Shift+Enter，Esc 退出)"><span data-icon="maximize"></span></button>
            <span class="tool-sep" aria-hidden="true"></span>
            <button id="restore" class="text-btn" title="移除编辑覆盖，恢复自动生成版本" disabled><span data-icon="restore"></span><span class="label">恢复默认</span></button>
            <button id="copy" class="tool-btn" title="复制全文" aria-label="复制全文" disabled><span data-icon="copy"></span></button>
            <button id="download-file" class="text-btn" title="下载当前文件，文件名带账号名" disabled><span data-icon="download"></span><span class="label">下载</span></button>
            <button id="save" class="button save" title="保存编辑 (⌘/Ctrl+S)" disabled><span data-icon="check"></span><span>保存</span></button>
          </div>
        </div>
        <div class="editor-body">
          <nav id="outline" class="outline" aria-label="配置大纲"><div class="outline-head"><span>大纲</span><span id="outline-total"></span></div><ol id="outline-list"></ol></nav>
          <div class="editor-stack">
            <div id="editor" aria-label="配置编辑器"><div class="editor-loading">正在加载编辑器…</div></div>
            <div id="diff-editor" aria-label="改动对比" hidden></div>
          </div>
        </div>
        <div class="statusbar"><div><span id="save-status" class="saved"><span class="connection-dot"></span>等待加载</span><span class="status-separator"></span><span id="validation-status">配置语法高亮</span></div><div><span id="line-count">0 行</span><span id="cursor-position">Ln 1, Col 1</span><span id="language-label">INI</span><span class="status-dim">UTF-8</span></div></div>
      </section>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
